<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Recommendations — dovetell</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:image" content="https://dovetell.io/assets/og.png">
<meta property="og:title" content="dovetell — Tell it once. Let it travel.">
<meta property="og:description" content="The context orchestration layer for AI-assisted software teams.">
<meta property="og:url" content="https://dovetell.io">
<meta name="twitter:card" content="summary_large_image">
<script defer data-domain="dovetell.io" src="https://plausible.io/js/script.js"></script>
<script src="/assets/dovetell-config.js"></script>
<link rel="stylesheet" href="/assets/preprod-banner.css"/>
<script defer src="/assets/preprod-banner.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blurple:#5865F2;--blurple-dark:#3B45C4;--blurple-light:#D8DAFD;
  --blurple-pale:#EEF0FE;--near-black:#1A1A2E;--text:#1A1A2E;
  --muted:#6B7280;--border:#E5E7EB;--surface:#F9FAFB;--white:#FFFFFF;
  --green:#16A34A;--green-light:#DCFCE7;
  --sans:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--white);min-height:100vh}

nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);z-index:100}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--near-black);text-decoration:none}
.wordmark span{color:var(--blurple)}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:500;transition:color 0.2s}
.nav-back:hover{color:var(--text)}

.page{max-width:860px;margin:0 auto;padding:48px 32px 100px}

.rec-hero{margin-bottom:40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blurple);margin-bottom:12px}
.rec-hero h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.rec-hero h1 em{font-style:normal;color:var(--blurple)}
.rec-hero p{font-size:15px;color:var(--muted);line-height:1.65;max-width:560px}

.journey-bar{display:flex;align-items:center;gap:0;margin-bottom:36px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;overflow-x:auto}
.journey-stop{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0}
.journey-stop.current{color:var(--blurple)}
.journey-stop.target{color:var(--near-black)}
.journey-icon{width:36px;height:36px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.journey-stop.current .journey-icon{background:var(--blurple-pale);color:var(--blurple)}
.journey-stop.target .journey-icon{background:var(--blurple);color:#fff}
.journey-arrow{color:var(--muted);padding:0 16px;font-size:18px}

.tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.tier-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column}
.tier-card.featured{border-color:var(--blurple);box-shadow:0 0 0 4px rgba(88,101,242,0.08)}
.tier-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:4px;margin-bottom:14px}
.tier-badge.free{background:var(--surface);color:var(--muted)}
.tier-badge.paid{background:var(--blurple-pale);color:var(--blurple)}
.tier-badge.best{background:var(--blurple);color:#fff}
.tier-name{font-size:16px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.tier-price{font-size:28px;font-weight:800;letter-spacing:-0.03em;color:var(--blurple);margin-bottom:4px}
.tier-price span{font-size:14px;font-weight:500;color:var(--muted)}
.tier-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.tier-includes{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tier-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);margin-bottom:8px;line-height:1.4}
.tier-item svg{color:var(--blurple);flex-shrink:0;margin-top:1px}
.tier-cta{margin-top:auto;padding-top:16px}
.btn-tier{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;text-decoration:none}
.btn-tier.free-btn{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-tier.free-btn:hover{border-color:var(--blurple);color:var(--blurple)}
.btn-tier.paid-btn{background:var(--blurple);color:#fff}
.btn-tier.paid-btn:hover{background:var(--blurple-dark)}

.review-card{background:var(--near-black);border-radius:14px;padding:24px;display:flex;align-items:flex-start;gap:20px;margin-bottom:36px}
.review-icon{width:48px;height:48px;border-radius:10px;background:rgba(88,101,242,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.review-body{flex:1}
.review-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:12px}
.review-price{color:var(--blurple-light)}
.review-desc{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.55;margin-bottom:12px}
.review-features{display:flex;flex-wrap:wrap;gap:8px}
.review-feat{font-size:11px;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.08);border-radius:4px;padding:4px 10px}
.btn-review{display:inline-flex;align-items:center;gap:8px;background:var(--blurple);color:#fff;font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;align-self:center}
.btn-review:hover{background:var(--blurple-dark)}

.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:12px}
.why-card{padding:16px}
.why-icon{font-size:20px;margin-bottom:8px}
.why-title{font-size:13px;font-weight:700;margin-bottom:4px}
.why-desc{font-size:12px;color:var(--muted);line-height:1.5}
.gumroad-note{text-align:center;font-size:12px;color:var(--muted);padding:12px}
.gumroad-note a{color:var(--blurple);font-weight:600}

footer{border-top:1px solid var(--border);padding:20px 0;display:flex;justify-content:space-between;align-items:center;margin-top:40px}
.footer-copy{font-size:12px;color:var(--muted)}
.footer-links{display:flex;gap:20px}
.footer-links a{font-size:12px;color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--blurple)}

@media(max-width:680px){
  nav{padding:16px 20px}
  .page{padding:32px 20px 80px}
  .tiers{grid-template-columns:1fr}
  .review-card{flex-direction:column}
  .why-grid{grid-template-columns:1fr}
  .journey-bar{flex-wrap:wrap;gap:8px}
  footer{flex-direction:column;gap:12px;text-align:center}
}
</style>
</head>
<body>

<nav>
  <a class="wordmark" href="/">dove<span>tell</span></a>
  <a class="nav-back" href="javascript:history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to results
  </a>
</nav>

<div class="page" id="page-content">
  <!-- Populated by JS from URL params -->
</div>

<script>
const ASSESSMENT_CONFIG_URL = '../team-assessment/assessment-config.json';
const FALLBACK_CONFIG = {
  revisionId: 'fallback',
  nextSteps: {
    Structured: [
      {title:'Formalize your prompt library with categories', description:'Group prompts by workflow or role so anyone can find what they need without asking.'},
      {title:'Add a review step for AI-generated outputs', description:'Designate someone to spot-check and approve AI work before it becomes official.'},
      {title:'Close your biggest context gap', description:'Pick the capability area that scored lowest and focus your next sprint there.'},
    ],
  },
  freeSampleRecommendations: {
    default: {
      name: 'Minimal Repo Context Starter',
      description: 'A small starter folder for getting repo-owned context into place without adding process weight.',
      includes: ['Core setup checklist','Minimal manifest','Session handoff template','Active task queue starter'],
      bestFor: 'Solo developers, founders, and teams that want agents to stop starting cold.',
      href: 'https://docs.dovetell.io/templates/free-samples',
    },
  },
};

async function loadAssessmentConfig() {
  try {
    const res = await fetch(ASSESSMENT_CONFIG_URL, {cache: 'no-store'});
    if (!res.ok) throw new Error(`Config load failed: ${res.status}`);
    return await res.json();
  } catch (error) {
    console.warn('Using fallback recommendations config', error);
    return FALLBACK_CONFIG;
  }
}

function pickFreeSample(config, role, teamSize, aiTool) {
  const samples = config.freeSampleRecommendations || FALLBACK_CONFIG.freeSampleRecommendations;
  const normalizedRole = (role || '').toLowerCase();
  const normalizedTeamSize = (teamSize || '').toLowerCase();
  const normalizedTool = (aiTool || '').toLowerCase();

  if (normalizedTool.includes('multiple')) {
    return samples['migration-cleanup'] || samples.default;
  }

  if (normalizedTeamSize.includes('2') || normalizedTeamSize.includes('6') ||
      normalizedTeamSize.includes('16') || normalizedTeamSize.includes('50')) {
    return samples['small-team'] || samples.default;
  }

  if (normalizedRole.includes('product') || normalizedRole.includes('engineering lead')) {
    return samples['small-team'] || samples.default;
  }

  return samples.default;
}

function applyStepTemplate(value, fallbackGapName) {
  return (value || '').replace('{{gapName}}', fallbackGapName);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  })[char]);
}

function safeHref(value, fallback) {
  try {
    const url = new URL(value || fallback, window.location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : fallback;
  } catch(e) {
    return fallback;
  }
}

function getDovetellConfig() {
  return window.DOVETELL_CONFIG || {};
}

function configuredEndpoint(key) {
  const config = getDovetellConfig();
  if (!config.persistenceEnabled) return '';
  return (config[key] || '').trim();
}

async function postJsonIfConfigured(endpoint, payload) {
  if (!endpoint) return null;
  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error(`Event persistence failed: ${response.status}`);
    return await response.json();
  } catch (error) {
    console.warn('dovetell event persistence skipped', error);
    return null;
  }
}

function buildTrackingBase(params) {
  return {
    public_token: params.get('token') || '',
    legacy_uid: params.get('uid') || '',
    legacy_pid: params.get('pid') || '',
    legacy_aid: params.get('aid') || '',
    revision_id: params.get('rev') || '',
    url_params: Object.fromEntries(params.entries()),
    path: window.location.pathname,
    created_at: new Date().toISOString(),
  };
}

function trackingParamsFromContext(context) {
  return new URLSearchParams({
    token: context.token || '',
    uid: context.uid || '',
    pid: context.pid || '',
    aid: context.aid || '',
    rev: context.rev || '',
    level: context.level || '',
    score: context.score || '',
    role: context.role || '',
    team_size: context.teamSize || '',
    ai_tool: context.aiTool || '',
    gap: context.gapName || '',
  });
}

function hasTrackingIdentity(paramsOrContext) {
  if (paramsOrContext instanceof URLSearchParams) {
    return Boolean(paramsOrContext.get('token') || paramsOrContext.get('aid'));
  }
  return Boolean(paramsOrContext?.token || paramsOrContext?.aid);
}

function eventEndpoint() {
  return configuredEndpoint('recommendationEventUrl') || configuredEndpoint('contentEventUrl');
}

async function trackRecommendationView(params, recommendation) {
  if (!hasTrackingIdentity(params)) return;
  await postJsonIfConfigured(eventEndpoint(), {
    event_kind: 'recommendation',
    ...buildTrackingBase(params),
    event_type: 'view',
    recommendation_key: recommendation.key || 'default',
    recommendation_name: recommendation.name || '',
    level_id: (params.get('level') || '').toLowerCase(),
    display_score: parseInt(params.get('score') || '0'),
    role: params.get('role') || '',
    team_size: params.get('team_size') || '',
    ai_tool: params.get('ai_tool') || '',
    biggest_gap_name: params.get('gap') || '',
  });
}

async function trackContentEvent(params, recommendation, eventType, href) {
  if (!hasTrackingIdentity(params)) return;
  await postJsonIfConfigured(eventEndpoint(), {
    event_kind: 'content',
    ...buildTrackingBase(params),
    event_type: eventType,
    content_key: recommendation.key || 'default',
    content_name: recommendation.name || '',
    href,
  });
}

async function fetchRunContextByToken(token) {
  const endpoint = configuredEndpoint('assessmentIntakeUrl');
  if (!token || !endpoint) return null;

  try {
    const url = new URL(endpoint);
    url.searchParams.set('token', token);
    const response = await fetch(url.href, {
      method: 'GET',
      headers: {'Accept': 'application/json'},
    });
    if (!response.ok) throw new Error(`Run context failed: ${response.status}`);
    const data = await response.json();
    return data?.ok ? data.run : null;
  } catch (error) {
    console.warn('dovetell run context unavailable', error);
    return null;
  }
}

function nextLevelFor(config, levelName) {
  return (config.scoring?.levels || []).find(level => level.name === levelName)?.nextLevel || '';
}

async function buildRecommendationContext(params, config) {
  const token = params.get('token') || '';
  const run = await fetchRunContextByToken(token);
  const level = run?.level || params.get('level') || 'Structured';
  const nextLevel = params.get('next') || nextLevelFor(config, level);

  return {
    token,
    level,
    nextLevel,
    score: parseInt(run?.score ?? params.get('score') ?? '0'),
    maxScore: parseInt(run?.max ?? params.get('max') ?? '100'),
    pid: run?.pid || params.get('pid') || '',
    uid: run?.uid || params.get('uid') || '',
    aid: run?.aid || params.get('aid') || '',
    rev: run?.rev || params.get('rev') || '',
    role: run?.role || params.get('role') || '',
    teamSize: run?.team_size || params.get('team_size') || '',
    aiTool: run?.ai_tool || params.get('ai_tool') || '',
    gapName: run?.gap || params.get('gap') || 'your lowest-scoring area',
    usedTokenContext: Boolean(run),
  };
}

function tierItemHtml(value) {
  return `<div class="tier-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${esc(value)}</div>`;
}

function freeSampleCardHtml(freeSample, freeSampleHref, featured = false) {
  return `
    <div class="tier-card ${featured ? 'featured' : ''}">
      <div class="tier-badge free">Free</div>
      <div class="tier-name">${esc(freeSample.name)}</div>
      <div class="tier-price">$0</div>
      <div class="tier-desc">${esc(freeSample.description)}</div>
      <div class="tier-includes">Includes</div>
      ${freeSample.includes.map(tierItemHtml).join('')}
      <div style="font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px">Best for: ${esc(freeSample.bestFor)}</div>
      <div class="tier-cta"><a class="btn-tier free-btn" id="free-sample-link" href="${esc(freeSampleHref)}">View free samples</a></div>
    </div>`;
}

function growthTierCardsHtml(freeSample, freeSampleHref) {
  return `
    <div class="tiers">
      ${freeSampleCardHtml(freeSample, freeSampleHref)}
      <div class="tier-card">
        <div class="tier-badge paid">Paid Kit</div>
        <div class="tier-name">Starter Kit</div>
        <div class="tier-price">$49</div>
        <div class="tier-desc">Everything you need to get started standardizing how your team works with AI.</div>
        <div class="tier-includes">Includes</div>
        ${['Prompt library template','Team context file','Handoff template','Governance checklist'].map(tierItemHtml).join('')}
        <div class="tier-cta"><button class="btn-tier paid-btn" type="button">Paid kit coming soon</button></div>
      </div>
      <div class="tier-card featured">
        <div class="tier-badge best">Best Value</div>
        <div class="tier-name">Pro Kit</div>
        <div class="tier-price">$99</div>
        <div class="tier-desc">Go further, faster with templates, examples, and a step-by-step rollout plan.</div>
        <div class="tier-includes">Everything in Starter, plus</div>
        ${['Starter Kit with filled-in examples','Rollout guide','Facilitation script','Sample repo structure'].map(tierItemHtml).join('')}
        <div class="tier-cta"><button class="btn-tier paid-btn" type="button">Paid kit coming soon</button></div>
      </div>
    </div>`;
}

function topLevelCardsHtml(freeSample, freeSampleHref) {
  return `
    <div class="tiers" style="grid-template-columns:1.2fr 1fr">
      ${freeSampleCardHtml(freeSample, freeSampleHref, true)}
      <div class="tier-card">
        <div class="tier-badge free">No upgrade needed</div>
        <div class="tier-name">Maintain the system</div>
        <div class="tier-price">$0</div>
        <div class="tier-desc">A top score means the next move is documentation, calibration, and keeping what works visible.</div>
        <div class="tier-includes">Recommended focus</div>
        ${['Capture examples from current workflows','Review stale prompts and context monthly','Share your operating model with the team','Retake after a workflow or tool change'].map(tierItemHtml).join('')}
      </div>
    </div>`;
}

function reviewCardHtml(isTopLevel) {
  return `
    <div class="review-card">
      <div class="review-icon">📅</div>
      <div class="review-body">
        <div class="review-title">${isTopLevel ? 'Optional Benchmark Review' : 'Setup Review'} <span class="review-price">${isTopLevel ? 'Optional' : '$299'}</span></div>
        <div class="review-desc">${isTopLevel
          ? 'Use this only if you want an outside read on whether your strong internal practices are durable, teachable, and ready to scale.'
          : 'Book a 60-minute session with a dovetell expert to review your setup, identify gaps, and get tailored recommendations for your team.'}</div>
        <div class="review-features">
          <span class="review-feat">✓ Personalized review of your results</span>
          <span class="review-feat">✓ Prioritized action plan</span>
          <span class="review-feat">✓ Q&A with an AI workflow expert</span>
        </div>
      </div>
      <button class="btn-review">${isTopLevel ? 'Join review waitlist →' : 'Book review →'}</button>
    </div>`;
}

window.addEventListener('DOMContentLoaded', async () => {
  const config = await loadAssessmentConfig();
  const p = new URLSearchParams(window.location.search);
  const context = await buildRecommendationContext(p, config);
  const level     = context.level;
  const nextLevel = context.nextLevel || null;
  const isTopLevel = level === 'Compounding' || !nextLevel;
  const headlineNext = isTopLevel ? 'the frontier' : nextLevel;
  const score     = context.score;
  const maxScore  = context.maxScore;
  const pid       = context.pid;
  const role      = context.role;
  const teamSize  = context.teamSize;
  const aiTool    = context.aiTool;
  const gapName   = context.gapName;

  const nextStepsByLevel = config.nextSteps || FALLBACK_CONFIG.nextSteps;
  const steps = nextStepsByLevel[level] || nextStepsByLevel['Structured'];
  const freeSample = pickFreeSample(config, role, teamSize, aiTool);
  freeSample.key = Object.entries(config.freeSampleRecommendations || {}).find(([, value]) => value === freeSample)?.[0] || 'default';
  const profileText = [role, teamSize, aiTool].filter(Boolean).join(' · ');
  const freeSampleHref = safeHref(freeSample.href, 'https://docs.dovetell.io/templates/free-samples');

  document.getElementById('page-content').innerHTML = `
    <div class="rec-hero">
      <div class="eyebrow">★ Recommended for your team</div>
      <h1>${isTopLevel
        ? 'You\'re at <em>the frontier.</em> Here\'s what\'s next.'
        : 'Here\'s how to move from <em>' + esc(level) + '</em> to <em>' + esc(nextLevel) + '</em>.'
      }</h1>
      <p>Based on your maturity score of ${score}/${maxScore}, these are the first resources to consider as your team ${isTopLevel ? 'maintains its advantage and shares what is working' : 'builds shared context, streamlines collaboration, and scales AI with confidence'}.</p>
      ${profileText ? `<p style="font-size:12px;margin-top:10px;color:var(--muted)">Profile signal: ${esc(profileText)}</p>` : ''}
    </div>

    ${isTopLevel ? `
    <div class="journey-bar">
      <div class="journey-stop current">
        <div class="journey-icon">${score}</div>
        ${esc(level)}
      </div>
      <div class="journey-arrow">★ Top level</div>
    </div>` : `
    <div class="journey-bar">
      <div class="journey-stop current">
        <div class="journey-icon">${score}</div>
        ${esc(level)}
      </div>
      <div class="journey-arrow">→ → →</div>
      <div class="journey-stop target">
        <div class="journey-icon">🚀</div>
        ${esc(nextLevel)}
      </div>
    </div>`}

    <div style="margin-bottom:32px">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:16px">Your next steps</div>
      ${steps.map((step, i) => `
        <div style="display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--blurple-pale);color:var(--blurple);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono)">${i+1}</div>
          <div>
            <div style="font-size:13px;font-weight:700;margin-bottom:3px">${esc(applyStepTemplate(step.title, gapName))}</div>
            <div style="font-size:12px;color:var(--muted);line-height:1.55">${esc(applyStepTemplate(step.description, gapName))}</div>
          </div>
        </div>`).join('')}
    </div>

    ${isTopLevel ? topLevelCardsHtml(freeSample, freeSampleHref) : growthTierCardsHtml(freeSample, freeSampleHref)}

    ${reviewCardHtml(isTopLevel)}

    <div style="font-size:15px;font-weight:800;letter-spacing:-0.01em;margin-bottom:16px;text-align:center">Why these recommendations</div>
    <div class="why-grid">
      <div class="why-card"><div class="why-icon">🔁</div><div class="why-title">Improve prompt reuse</div><div class="why-desc">Standardized prompts and examples help your team move faster and stay consistent.</div></div>
      <div class="why-card"><div class="why-icon">🤝</div><div class="why-title">Reduce handoff friction</div><div class="why-desc">Clear handoff templates and governance reduce back-and-forth and context loss.</div></div>
      <div class="why-card"><div class="why-icon">⚡</div><div class="why-title">Build shared context faster</div><div class="why-desc">Centralized templates and context files help everyone stay aligned from day one.</div></div>
    </div>

    <div class="gumroad-note">Paid kits are not live yet. Pricing and fulfillment links will be added after the templates pass review.</div>

    <footer>
      <span class="footer-copy">© 2026 dovetell.io</span>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/privacy">Privacy</a>
        ${pid ? '<a href="/assessments/?pid=' + pid + '">My assessments</a>' : ''}
      </div>
    </footer>`;

  const trackingParams = trackingParamsFromContext(context);
  trackRecommendationView(trackingParams, freeSample);
  document.getElementById('free-sample-link')?.addEventListener('click', () => {
    trackContentEvent(trackingParams, freeSample, 'click', freeSampleHref);
  });
});
</script>
</body>
