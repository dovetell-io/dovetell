<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Assessments — dovetell</title>
<script defer data-domain="dovetell.io" src="https://plausible.io/js/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blurple:#5865F2;
  --blurple-dark:#3B45C4;
  --blurple-light:#D8DAFD;
  --blurple-pale:#EEF0FE;
  --near-black:#1A1A2E;
  --text:#1A1A2E;
  --muted:#6B7280;
  --border:#E5E7EB;
  --surface:#F9FAFB;
  --white:#FFFFFF;
  --green:#16A34A;
  --green-light:#DCFCE7;
  --red:#DC2626;
  --red-light:#FEE2E2;
  --yellow:#D97706;
  --sans:'Plus Jakarta Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--white);min-height:100vh}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);z-index:100}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--near-black);text-decoration:none}
.wordmark span{color:var(--blurple)}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:color 0.2s}
.nav-links a:hover{color:var(--text)}
.nav-cta{background:var(--blurple) !important;color:#fff !important;padding:8px 16px;border-radius:7px;font-weight:700 !important}
.nav-cta:hover{background:var(--blurple-dark) !important}

/* PAGE */
.page{max-width:860px;margin:0 auto;padding:48px 32px 100px}

/* WELCOME BACK HERO */
.hero{margin-bottom:40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blurple);margin-bottom:12px}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.hero h1 em{font-style:normal;color:var(--blurple)}
.hero-sub{font-size:15px;color:var(--muted);line-height:1.65}

/* LAST SCORE CARD */
.last-score-section{margin-bottom:40px}
.section-title{font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.score-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:28px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;box-shadow:0 2px 16px rgba(0,0,0,0.05)}
.score-gauge{width:72px;height:72px;position:relative;flex-shrink:0}
.score-gauge svg{transform:rotate(-90deg)}
.score-gauge-track{fill:none;stroke:#E5E7EB;stroke-width:6}
.score-gauge-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.score-gauge-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-gauge-num span{font-size:18px;font-weight:800;color:var(--near-black);line-height:1}
.score-gauge-num small{font-size:10px;color:var(--muted);font-family:var(--mono)}
.score-body{}
.score-level{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.score-meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.score-pid{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px;display:inline-block}
.score-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.btn-retake{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blurple);color:#fff;font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all 0.2s}
.btn-retake:hover{background:var(--blurple-dark)}
.btn-share{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--text);font-family:var(--sans);font-size:12px;font-weight:600;padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;white-space:nowrap;transition:all 0.2s}
.btn-share:hover{border-color:var(--blurple);color:var(--blurple)}

/* NO PID STATE */
.no-pid{text-align:center;padding:80px 40px}
.no-pid-icon{font-size:48px;margin-bottom:20px}
.no-pid h2{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px}
.no-pid p{font-size:15px;color:var(--muted);margin-bottom:28px;line-height:1.65;max-width:400px;margin-left:auto;margin-right:auto}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--blurple);color:#fff;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px 28px;border-radius:9px;border:none;cursor:pointer;text-decoration:none;transition:all 0.2s}
.btn-primary:hover{background:var(--blurple-dark)}

/* LEVEL SCALE */
.level-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:32px}
.level-item{padding:14px 12px;text-align:center;border-right:1px solid var(--border)}
.level-item:last-child{border-right:none}
.level-item.current{background:var(--blurple-pale)}
.level-name{font-size:12px;font-weight:700;margin-bottom:2px}
.level-item.current .level-name{color:var(--blurple)}
.level-range{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* LINK BOX */
.link-section{margin-bottom:32px}
.link-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.link-box-label{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.link-box-url{font-family:var(--mono);font-size:12px;color:var(--blurple);word-break:break-all;cursor:pointer;padding:8px 12px;background:var(--white);border:1px solid var(--border);border-radius:6px;display:block;transition:background 0.2s}
.link-box-url:hover{background:var(--blurple-pale)}
.link-box-note{font-size:11px;color:var(--muted);margin-top:6px}

/* NEW PROJECT */
.new-project-card{border:1.5px dashed var(--border);border-radius:16px;padding:28px;text-align:center;transition:border-color 0.2s}
.new-project-card:hover{border-color:var(--blurple)}
.new-project-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.new-project-card p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.55}

/* UPGRADE BANNER */
.upgrade-banner{background:linear-gradient(135deg,var(--near-black) 0%,#2A2A4A 100%);border-radius:14px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:40px}
.upgrade-text h3{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.02em;margin-bottom:6px}
.upgrade-text p{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.55;max-width:380px}
.btn-upgrade{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--blurple);font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;text-decoration:none;transition:all 0.2s;flex-shrink:0}
.btn-upgrade:hover{background:var(--blurple-light)}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:20px 0;display:flex;justify-content:space-between;align-items:center;margin-top:60px}
.footer-copy{font-size:12px;color:var(--muted)}
.footer-links{display:flex;gap:20px}
.footer-links a{font-size:12px;color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--blurple)}

/* RESPONSIVE */
@media(max-width:680px){
  nav{padding:16px 20px}
  .page{padding:32px 20px 80px}
  .score-card{grid-template-columns:1fr;text-align:center}
  .score-gauge{margin:0 auto}
  .score-actions{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .level-scale{grid-template-columns:1fr 1fr}
  .level-item:nth-child(2){border-right:none}
  .upgrade-banner{flex-direction:column;text-align:center}
  .upgrade-text p{max-width:100%}
  footer{flex-direction:column;gap:12px;text-align:center}
}
</style>
</head>
<body>

<nav>
  <a class="wordmark" href="/">dove<span>tell</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/team-assessment" class="nav-cta">New assessment →</a>
  </div>
</nav>

<div class="page" id="page-content">
  <!-- Populated by JS based on pid -->
</div>

<script>
// ── LOCALSTORAGE HELPERS ──────────────────────────────────────────────────────
function saveRun(pid, data) {
  try { localStorage.setItem('dovetell_run_' + pid, JSON.stringify(data)); } catch(e) {}
}

function getLastRun(pid) {
  try {
    const raw = localStorage.getItem('dovetell_run_' + pid);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function getHistory(pid) {
  try {
    const raw = localStorage.getItem('dovetell_history_' + pid);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

// ── COPY LINK ─────────────────────────────────────────────────────────────────
function copyLink(el, link) {
  navigator.clipboard?.writeText(link).then(() => {
    const orig = el.textContent;
    el.textContent = '✓ Copied!';
    setTimeout(() => { el.textContent = orig; }, 2000);
  });
}

// ── LEVEL HELPERS ─────────────────────────────────────────────────────────────
const levelColors = {
  'Scattered':   '#DC2626',
  'Structured':  '#D97706',
  'Coordinated': '#5865F2',
  'Compounding': '#16A34A',
};

const levelDescriptions = {
  'Scattered':   'Ad hoc AI use with isolated results. No shared context or standard prompts.',
  'Structured':  'Some repeatable practices but inconsistent. Context is scattered, handoffs vary.',
  'Coordinated': 'Aligned team practices and shared context. The foundation is solid.',
  'Compounding': 'Systematic advantage and continuous lift. AI is deeply embedded.',
};

function getScoreColor(level) {
  return levelColors[level] || '#5865F2';
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────
function buildGauge(score, maxScore, color) {
  const r = 30;
  const circ = 2 * Math.PI * r;
  const offset = circ - (circ * (score / maxScore));
  return `
    <div class="score-gauge">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="score-gauge-track" cx="36" cy="36" r="${r}"/>
        <circle class="score-gauge-fill"  cx="36" cy="36" r="${r}"
          stroke="${color}"
          stroke-dasharray="${circ}"
          stroke-dashoffset="${offset}"/>
      </svg>
      <div class="score-gauge-num">
        <span>${score}</span>
        <small>/${maxScore}</small>
      </div>
    </div>`;
}

function buildHistory(history) {
  if (!history || history.length < 2) return '';
  const rows = history.map((run, i) => {
    const date = new Date(run.takenAt).toLocaleDateString('en-US',
      {month:'short', day:'numeric', year:'numeric'});
    const color = levelColors[run.level] || '#5865F2';
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);min-width:80px">${date}</div>
      <div style="font-size:13px;font-weight:700;color:${color};min-width:90px">${run.level}</div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">${run.score}/${run.maxScore}</div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto">aid: ${run.aid || '—'}</div>
    </div>`;
  }).join('');

  return `<div style="margin-bottom:24px">
    <div class="section-title" style="margin-bottom:12px">Run history (${history.length} assessments)</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 16px">
      ${rows}
    </div>
  </div>`;
}

function buildLevelScale(currentLevel) {
  const levels = [
    {name:'Scattered',   range:'0–12'},
    {name:'Structured',  range:'13–24'},
    {name:'Coordinated', range:'25–30'},
    {name:'Compounding', range:'31–36'},
  ];
  return `<div class="level-scale">
    ${levels.map(l => `
      <div class="level-item ${l.name === currentLevel ? 'current' : ''}">
        <div class="level-name" style="${l.name === currentLevel ? 'color:' + levelColors[l.name] : ''}">${l.name}</div>
        <div class="level-range">${l.range}</div>
      </div>`).join('')}
  </div>`;
}

// ── RENDER: HAS PID ───────────────────────────────────────────────────────────
function renderWithPid(pid, lastRun, history) {
  const retakeUrl = '/team-assessment/?pid=' + pid;
  const shareUrl  = 'https://dovetell.io/assessments/?pid=' + pid;
  const color = lastRun ? getScoreColor(lastRun.level) : '#5865F2';
  const runCount = history.length;

  let scoreSection = '';
  if (lastRun) {
    const date = new Date(lastRun.takenAt).toLocaleDateString('en-US',
      {month:'long', day:'numeric', year:'numeric'});
    const runLabel = runCount > 1
      ? runCount + ' assessments taken · Last: ' + date
      : 'First assessment · ' + date;

    scoreSection = `
      <div class="last-score-section">
        <div class="section-title">Latest score</div>
        <div class="score-card">
          ${buildGauge(lastRun.score, lastRun.maxScore, color)}
          <div class="score-body">
            <div class="score-level" style="color:${color}">${lastRun.level}</div>
            <div class="score-meta">${lastRun.score}/${lastRun.maxScore} · ${runLabel}</div>
            <div class="score-pid">pid: ${pid} · aid: ${lastRun.aid || '—'} · vid: ${lastRun.vid || 'v01'}</div>
          </div>
          <div class="score-actions">
            <a class="btn-retake" href="${retakeUrl}">&#8635; Retake</a>
            <button class="btn-share" onclick="copyLink(this, '${shareUrl}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Copy link
            </button>
          </div>
        </div>
      </div>
      ${buildLevelScale(lastRun.level)}
      ${runCount > 1 ? buildHistory(history) : ''}`;
  } else {
    scoreSection = `
      <div class="last-score-section">
        <div class="section-title">Project</div>
        <div class="score-card" style="grid-template-columns:1fr auto">
          <div class="score-body">
            <div class="score-level" style="color:var(--blurple)">No runs yet</div>
            <div class="score-meta">This project hasn't been scored yet.</div>
            <div class="score-pid">pid: ${pid}</div>
          </div>
          <div class="score-actions">
            <a class="btn-retake" href="${retakeUrl}">Start assessment →</a>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('page-content').innerHTML = `
    <div class="hero">
      <div class="eyebrow">&#8635; Returning visitor</div>
      <h1>Welcome <em>back.</em></h1>
      <p class="hero-sub">${lastRun
        ? 'Last time you scored ' + lastRun.score + '/' + lastRun.maxScore + ' — ' + lastRun.level + '. Retake to see how your team has matured.'
        : 'We found your project link. Take the assessment to start tracking your team\'s maturity over time.'
      }</p>
    </div>

    ${scoreSection}

    <div class="link-section">
      <div class="link-box">
        <div class="link-box-label">Your unique project link</div>
        <div class="link-box-url" onclick="copyLink(this, '${shareUrl}')">${shareUrl}</div>
        <div class="link-box-note">Tap to copy · Bookmark this to track progress over time</div>
      </div>
    </div>

    <div class="new-project-card">
      <h3>Starting something new?</h3>
      <p>Each project gets its own link and tracking thread. Start a fresh assessment for a new team or initiative.</p>
      <a class="btn-primary" href="/team-assessment/">
        Start a new project →
      </a>
    </div>

    <div class="upgrade-banner">
      <div class="upgrade-text">
        <h3>Ready to automate your context layer?</h3>
        <p>dovetell platform is coming — context base, unvetted queue, MCP integration. Join the waitlist.</p>
      </div>
      <a class="btn-upgrade" href="/#waitlist">Join the waitlist →</a>
    </div>

    <footer>
      <span class="footer-copy">© 2026 dovetell.io</span>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/privacy">Privacy</a>
        <a href="/team-assessment">Assessment</a>
      </div>
    </footer>`;
}

// ── RENDER: NO PID ────────────────────────────────────────────────────────────
function renderNoPid() {
  document.getElementById('page-content').innerHTML = `
    <div class="no-pid">
      <div class="no-pid-icon">🕊</div>
      <h2>No project found</h2>
      <p>This page is for returning users who have a unique assessment link. Take the assessment to get yours.</p>
      <a class="btn-primary" href="/team-assessment/">
        Take the free assessment →
      </a>
    </div>

    <footer>
      <span class="footer-copy">© 2026 dovetell.io</span>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/privacy">Privacy</a>
      </div>
    </footer>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const pid = params.get('pid');

  if (!pid || !/^[a-z0-9]{6,12}$/.test(pid)) {
    renderNoPid();
    return;
  }

  const lastRun = getLastRun(pid);
  const history = getHistory(pid);
  renderWithPid(pid, lastRun, history);
});
</script>
</body>
</html>
